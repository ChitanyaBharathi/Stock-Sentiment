name: CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm install --include=optional

      - name: Run Linter (Oxlint)
        run: npx --yes oxlint@latest src

      - name: Run Vitest Unit & Component Tests
        run: npx vitest run

      - name: Build Verification
        run: npx vite build
